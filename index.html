    <meta charset="UTF-8" />

    <script>
      (function () {
        try {
          var currentFetch =
            typeof window.fetch === 'function'
              ? window.fetch.bind(window)
              : undefined;
          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function () {
              return currentFetch;
            },
            set: function (nextFetch) {
              if (typeof nextFetch === 'function') {
                currentFetch = nextFetch;
              }
            }
          };
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(
              Window.prototype,
              'fetch'
            );
            if (!protoDesc || protoDesc.configurable !== false) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          }
          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!winDesc || winDesc.configurable !== false) {
            Object.defineProperty(window, 'fetch', descriptor);
          }
        } catch (_err) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              ((event.filename &&
                event.filename.indexOf('chrome-extension://') === 0) ||
                (event.message &&
                  event.message.indexOf(
                    'Cannot set property fetch of #<Window>'
                  ) !== -1))
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
